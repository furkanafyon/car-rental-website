<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Car Rental online shop" />
    <title>Contact</title>

    <link

      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="../styles/styles.css" />

      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    /> -->
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg d-flex flex-row mb-3" id="navcolour">
        <div class="container-fluid">
          <a class="navbar-brand pagecolour" href="../index.html">Car Rental</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a
                class="nav-link pagecolour"
                aria-current="page"
                href="../index.html"
                >Home</a
              >
              <a class="nav-link pagecolour" href="./cars.html">Cars</a>
              <a class="nav-link pagecolour" href="./book.html">Book</a>
              <a class="nav-link pagecolour" href="./contact.html"
                >Contact Us</a
              >
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="container-md gap-12 p-5">
      <div class="row">
        <div class="col-12 col-lg-6 mb-12">
          <!-- form -->
          <div class="d-flex flex-column gap-5 p-5">
            <h3 class="fw-bold">Contact Us</h3>

            <p class="fw-bold">Make an enquiry and we will reply in no time</p>

            <!-- The form -->
            <form id="form" class="p-5">
              <!-- name input -->
              <div class="formField">
                <label for="nameInput" class="form-label fw-bold">Name *</label>
                <input
                  type="text"
                  class="form-control mb-2"
                  id="nameInput"
                  minlength="2"
                  maxlength="30"
                  required
                />
                <p class="error" id="name-error"></p>
              </div>
              <!-- email input -->

              <div class="formField">
                <label for="emailInput" class="form-label fw-bold"
                  >Email *</label
                >
                <input
                  type="email"
                  class="form-control mb-2"
                  id="emailInput"
                  placeholder="name@example.com"
                  minlength="6"
                  maxlength="254"
                  required
                />
                <p class="error" id="email-error"></p>
              </div>

              <div class="formField">
                <!-- phone input -->
                <label for="phoneInput" class="form-label fw-bold"
                  >Phone *</label
                >
                <input
                  type="tel"
                  class="form-control mb-2"
                  id="phoneInput"
                  placeholder="+353 87 123 4567"
                  required
                />
                <p class="error" id="phone-error"></p>
              </div>

              <!-- query type selection  -->

              <div class="form-field mb-5">
                <label for="queryTypeSelect" class="form-label fw-bold"
                  >Query type *</label
                >
                <select class="form-control mb-2" id="queryTypeSelect">
                  <option selected value="0">Choose one</option>
                  <option value="1">New Booking Enquiry</option>
                  <option value="2">Change or Cancel a Booking</option>
                  <option value="3">Current Rental Support / Breakdown</option>
                  <option value="4">Billing or Payment</option>
                  <option value="5">Damage or Accident Report</option>
                  <option value="6">Feedback or Complaint</option>
                  <option value="7">Other</option>
                </select>
                <p class="error" id="query-error"></p>
              </div>

              <!-- message input -->

              <div class="form-field mb-5">
                <label for="messageInput" class="form-label fw-bold"
                  >Message</label
                >
                <textarea
                  class="form-control mb-2"
                  id="messageInput"
                  rows="3"
                  minlength="10"
                  maxlength="2000"
                  required
                ></textarea>
                <p class="error" id="message-error"></p>
              </div>

              <button class="btn btn-solid" type="submit">Send enquiry</button>

              <div
                class="alert alert-success mt-5 d-none"
                role="alert"
                id="success-alert"
              >
                Thank your for your enquiry. A member of our team will assist
                you as soon as possible
              </div>
            </form>
          </div>

          <!-- end of form -->
        </div>
        <div class="col-12 col-lg-6">
          <!-- FAQ Section -->
          <h3 class="text-center mb-5">FAQs</h3>

          <!-- faqs container -->

          <div class="faqs-container">
            <input type="text" placeholder="Search" maxlength="500" class="mb-5" id="faqSearchInput">
            <div
              class="accordion accordion-flush accordion-gap"
              id="faq-accordion"
            ></div>
          </div>

          <!-- <div
            class="accordion accordion-flush accordion-gap"
            id="faq-accordion"
          ></div> -->

          <!-- End Of FAQ Section -->
        </div>
      </div>
    </main>

    <footer
      class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
      id="footer-bg-colour"
    >
      <div class="col-md-4 d-flex align-items-center">
        <span class="mb-3 mb-md-0 footercolour">© 2026 Car Rental</span>
      </div>
    </footer>
    <script src="../js/contact.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
