<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Car Rental online shop" />
    <title>Car Rental</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../styles/styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg d-flex flex-row mb-3" id="navcolour">
        <div class="container-fluid">
          <a class="navbar-brand pagecolour" href="../index.html">Car Rental</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a
                class="nav-link pagecolour"
                aria-current="page"
                href="../index.html"
                >Home</a
              >
              <a class="nav-link pagecolour" href="./cars.html">Cars</a>
              <a class="nav-link pagecolour" href="./book.html">Book</a>
              <a class="nav-link pagecolour" href="./contact.html"
                >Contact Us</a
              >
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <!-- Cassio's code -->
      <div class="container my-5">
        <div class="row mb-4">
          <div class="col-md-6">
            <h2 class="text-brand">Available Cars</h2>
          </div>
          <!-- Here are the filters and controls -->
          <div
            class="col-md-6 d-flex justify-content-md-end align-items-center gap-2"
          >
            <select id="brandFilter" class="form-select w-auto">
              <option value="all">All Brands</option>
              <option value="Ford">Ford</option>
              <option value="Volkswagen">Volkswagen</option>
              <option value="Toyota">Toyota</option>
            </select>
            <select id="priceSort" class="form-select w-auto">
              <option value="default">Sort by Price</option>
              <option value="low">Lowest to Highest</option>
              <option value="high">Highest to Lowest</option>
            </select>
          </div>
        </div>
        <!-- Container where Javascript will inject the car cards -->
        <div id="car-container" class="row g-4"></div>
      </div>
    </main>

    <footer
      class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top"
      id="footer-bg-colour"
    >
      <div class="col-md-4 d-flex align-items-center">
        <span class="mb-3 mb-md-0 pagecolour">© 2026 Car Rental</span>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>

    <!-- Javascript created for the sort/price -->
    <script src="../js/fleet.js"></script>
  </body>
</html>
